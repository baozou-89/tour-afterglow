<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tour Afterglow</title>
<meta name="description" content="行程之後的逛街地圖">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23B4491A'/%3E%3Ccircle cx='16' cy='13' r='5' fill='%23FBF5EA'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/tokens.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
<body>
<div id="map" aria-label="地圖"></div>

<header class="top">
  <div class="titlebar">
    <div class="title">
      <span class="kicker">TOUR AFTERGLOW</span>
      <span class="day-title" id="dayTitle">Day 1</span>
    </div>
    <div class="basemap" role="group" aria-label="底圖">
      <button type="button" data-basemap="osm" aria-pressed="false">OSM</button>
      <button type="button" data-basemap="gsi" aria-pressed="false" title="地理院 標準地図（向量）">標準</button>
      <button type="button" data-basemap="gsipale" aria-pressed="true" title="地理院 淡色地図（向量）">淡色</button>
      <button type="button" data-basemap="photo" aria-pressed="false">写真</button>
    </div>
  </div>
  <nav class="days" id="days" role="tablist" aria-label="切換日期"></nav>
</header>

<section class="sheet" id="sheet" data-snap="mid" aria-label="圖層">
  <div class="handle" id="sheetHandle">
    <button type="button" class="grip" id="grip" aria-label="拖曳或點擊調整面板高度" aria-expanded="false"><span></span></button>
    <p class="area" id="dayArea"></p>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips secondary" id="layerChips"></div>
  <div class="chips anno" id="annoChips" aria-label="地理院地圖註記"></div>
  <ol class="shop-list" id="shopList"></ol>
</section>
<p class="attrib" id="attrib"></p>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="js/days.js"></script>
<script src="js/app.js"></script>
</body>
</html>
