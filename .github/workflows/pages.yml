name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh shops from Google Places"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard (private words are kept in the PRIVATE_WORDS secret, an extended regex)
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
        run: |
          if [ -n "$PRIVATE_WORDS" ] && grep -rInE "$PRIVATE_WORDS" site/; then
            echo "::error::Private itinerary details found in site/"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
